<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Classroom Timer - Ethan's Teacher Toolkit -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Classroom Timer</title>
  <link rel="stylesheet" href="../shared/toolkit-home.css">
  <script src="../shared/toolkit-home.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #2563eb;
      --accent-light: #dbeafe;
      --accent-warm: #f59e0b;
      --accent-warm-light: #fef3c7;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --success: #16a34a;
      --radius: 14px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.06);
      --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.06);
    }

    html, body {
      height: 100%;
      height: 100dvh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f5f7fb 50%, #fef3c7 100%);
      color: var(--text);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body.flash-alarm {
      animation: alarmFlash 0.6s ease-in-out infinite;
    }

    @keyframes alarmFlash {
      0%, 100% { background: linear-gradient(135deg, #eef2ff 0%, #f5f7fb 50%, #fef3c7 100%); }
      50% { background: linear-gradient(135deg, #fee2e2 0%, #fecaca 45%, #fef2f2 100%); }
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    button:not(:disabled):active {
      transform: scale(0.97);
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100%;
      height: 100dvh;
      max-width: 1200px;
      margin: 0 auto;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow: hidden;
    }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: rgb(255 255 255 / 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 50;
      overflow: visible;
    }

    .top-bar__title {
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--primary);
      white-space: nowrap;
    }

    .top-bar__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn-top {
      padding: 10px 16px;
      min-height: 44px;
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: clamp(0.8rem, 2.2vw, 0.95rem);
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid var(--border);
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-top:not(.btn-top--reset):not(.btn-top--sound-on):hover {
      background: var(--surface-2);
      border-color: #c7d2fe;
    }

    .help-wrap {
      position: relative;
    }

    .btn-top--help {
      background: var(--surface);
      color: var(--text-muted);
    }

    .btn-top--help:hover,
    .help-wrap.is-open .btn-top--help {
      background: var(--primary-light);
      color: var(--primary);
      border-color: #c7d2fe;
    }

    .help-popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: max-content;
      max-width: min(320px, 88vw);
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--text-muted);
      text-align: left;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
      z-index: 100;
      pointer-events: none;
    }

    .help-popover__title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .help-popover kbd {
      display: inline-block;
      min-width: 1.35em;
      padding: 1px 5px;
      margin: 0 1px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface-2);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
    }

    .help-popover__row + .help-popover__row {
      margin-top: 4px;
    }

    .help-wrap:hover .help-popover,
    .help-wrap:focus-within .help-popover,
    .help-wrap.is-open .help-popover {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn-top--reset { background: var(--danger); border-color: #fca5a5; color: #fff; }
    .btn-top--reset:hover { background: #dc2626; }

    .btn-top--sound-on { background: var(--success); border-color: #86efac; color: #fff; }
    .btn-top--sound-off { background: var(--surface-2); color: var(--text-muted); }

    .btn-top--lang {
      background: var(--primary-light);
      color: var(--primary);
      border-color: #c7d2fe;
      min-width: 4.5rem;
    }

    .btn-top--lang:hover {
      background: #e0e7ff;
    }

    /* ── Display ── */
    .display-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      min-height: 0;
      overflow: hidden;
    }

    .clock-display {
      width: 100%;
      max-width: 900px;
      max-height: 100%;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: clamp(8px, 2vh, 24px) clamp(12px, 3vw, 32px);
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .clock-display::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px solid var(--primary-light);
      border-radius: calc(var(--radius) - 4px);
      pointer-events: none;
    }

    .time-digits {
      font-family: "Consolas", "Courier New", monospace;
      font-size: clamp(48px, min(12vw, 16vh), 180px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: 0.04em;
      color: var(--primary);
      text-shadow: 0 2px 8px rgb(79 70 229 / 0.15);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .time-digits.paused {
      color: var(--accent-warm);
      text-shadow: 0 2px 8px rgb(245 158 11 / 0.2);
    }

    .time-digits.finished {
      color: var(--danger);
      text-shadow: 0 2px 8px rgb(239 68 68 / 0.2);
    }

    .input-preview {
      margin-top: clamp(4px, 1vh, 12px);
      font-size: clamp(0.75rem, 1.8vh, 1rem);
      color: var(--text-muted);
      min-height: 1.2em;
      line-height: 1.3;
    }

    .times-up {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgb(255 255 255 / 0.88);
      border-radius: var(--radius);
      z-index: 2;
    }

    .times-up.visible {
      display: flex;
    }

    .times-up span {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 900;
      color: var(--danger);
      letter-spacing: 0.08em;
      text-shadow: 0 4px 12px rgb(239 68 68 / 0.25);
      animation: pulse 0.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }

    /* ── Controls ── */
    .controls {
      flex-shrink: 0;
      padding: 10px 14px 14px;
      background: rgb(255 255 255 / 0.92);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 2;
      box-shadow: 0 -4px 12px rgb(0 0 0 / 0.04);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }

    .keypad .btn-digit--zero {
      grid-column: 2;
    }

    .btn-digit {
      min-height: clamp(44px, 8vh, 64px);
      font-size: clamp(1.2rem, 3.5vw, 1.75rem);
      font-weight: 700;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      transition: border-color 0.15s, background 0.15s;
    }

    .btn-digit:not(:disabled):hover {
      background: var(--primary-light);
      border-color: #c7d2fe;
      color: var(--primary);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .btn-action {
      flex: 1 1 auto;
      min-width: clamp(72px, 18vw, 110px);
      min-height: clamp(42px, 7vh, 56px);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      font-weight: 600;
      border: 1px solid transparent;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-start {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgb(79 70 229 / 0.3);
    }

    .btn-start:not(:disabled):hover { background: var(--primary-hover); }

    .btn-pause {
      background: var(--accent-warm);
      color: #78350f;
      border-color: #fcd34d;
    }

    .btn-resume {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgb(37 99 235 / 0.25);
    }

    .btn-clear {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-clear:not(:disabled):hover { background: var(--surface-2); }

    .btn-adjust {
      background: var(--primary-light);
      color: var(--primary);
      border-color: #c7d2fe;
      min-width: clamp(64px, 15vw, 90px);
    }

    .btn-adjust:not(:disabled):hover { background: #e0e7ff; }

    .btn-adjust--minus {
      background: var(--danger-light);
      color: #b91c1c;
      border-color: #fca5a5;
    }

    .btn-adjust--minus:not(:disabled):hover { background: #fecaca; }

    .adjust-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .adjust-row__label {
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: -4px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      color: var(--text);
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 9999;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-height: 720px) {
      .top-bar {
        padding: 6px 10px;
      }

      .btn-top {
        min-height: 38px;
        padding: 8px 12px;
      }

      .time-digits {
        font-size: clamp(40px, min(10vw, 14vh), 140px);
      }

      .input-preview {
        display: none;
      }

      .controls {
        gap: 8px;
        padding: 8px 10px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <h1 class="top-bar__title" data-i18n="tool.classroom-timer.title">Classroom Timer</h1>
      <div class="top-bar__actions">
        <button type="button" class="btn-top btn-top--lang" id="btnLanguage" data-i18n-aria="tool.classroom-timer.aria.switchLanguage">한국어</button>
        <div class="help-wrap" id="helpWrap">
          <button type="button" class="btn-top btn-top--help" id="btnHelp" aria-expanded="false" aria-controls="helpPopover" data-i18n="tool.classroom-timer.actions.howToUse">How to use</button>
          <div class="help-popover" id="helpPopover" role="tooltip">
            <div class="help-popover__title" data-i18n="tool.classroom-timer.help.title">Keyboard shortcuts</div>
            <div class="help-popover__row"><kbd>0</kbd>–<kbd>9</kbd> <span data-i18n="tool.classroom-timer.help.digitsHint">Enter time (e.g. 630 → 6:30)</span></div>
            <div class="help-popover__row"><kbd>Enter</kbd> <span data-i18n="tool.classroom-timer.help.enterStart">Start / Resume</span> · <kbd>Space</kbd> <span data-i18n="tool.classroom-timer.help.spacePause">Pause</span></div>
            <div class="help-popover__row"><kbd>C</kbd> · <kbd>R</kbd> · <kbd>F</kbd> <span data-i18n="tool.classroom-timer.help.clearResetFullscreen">Clear · Reset · Fullscreen</span></div>
            <div class="help-popover__row"><kbd>Backspace</kbd> · <kbd>Esc</kbd> <span data-i18n="tool.classroom-timer.help.backspaceEsc">Delete digit · Cancel / exit full</span></div>
          </div>
        </div>
        <button type="button" class="btn-top" id="btnFullscreen" data-i18n="tool.classroom-timer.actions.fullscreen" data-i18n-aria="tool.classroom-timer.aria.toggleFullscreen">Fullscreen</button>
        <button type="button" class="btn-top btn-top--reset" id="btnResetTop" data-i18n="tool.classroom-timer.actions.reset">Reset</button>
        <button type="button" class="btn-top btn-top--sound-on" id="btnSound" aria-pressed="true" data-i18n="tool.classroom-timer.actions.soundOn">Sound ON</button>
      </div>
    </header>

    <main class="display-area">
      <div class="clock-display">
        <div class="time-digits" id="timeDisplay" aria-live="polite">00:00:00</div>
        <div class="input-preview" id="inputPreview"></div>
        <div class="times-up" id="timesUp" aria-hidden="true">
          <span data-i18n="tool.classroom-timer.status.timesUp">TIME'S UP!</span>
        </div>
      </div>
    </main>

    <section class="controls" data-i18n-aria="tool.classroom-timer.aria.timerControls" aria-label="Timer controls">
      <div class="keypad" id="keypad">
        <button type="button" class="btn-digit" data-digit="7">7</button>
        <button type="button" class="btn-digit" data-digit="8">8</button>
        <button type="button" class="btn-digit" data-digit="9">9</button>
        <button type="button" class="btn-digit" data-digit="4">4</button>
        <button type="button" class="btn-digit" data-digit="5">5</button>
        <button type="button" class="btn-digit" data-digit="6">6</button>
        <button type="button" class="btn-digit" data-digit="1">1</button>
        <button type="button" class="btn-digit" data-digit="2">2</button>
        <button type="button" class="btn-digit" data-digit="3">3</button>
        <button type="button" class="btn-digit btn-digit--zero" data-digit="0">0</button>
      </div>

      <div class="action-row">
        <button type="button" class="btn-action btn-start" id="btnStart" data-i18n="tool.classroom-timer.actions.start">Start</button>
        <button type="button" class="btn-action btn-pause" id="btnPause" data-i18n="tool.classroom-timer.actions.pause">Pause</button>
        <button type="button" class="btn-action btn-resume" id="btnResume" data-i18n="tool.classroom-timer.actions.resume">Resume</button>
        <button type="button" class="btn-action btn-clear" id="btnClear" data-i18n="tool.classroom-timer.actions.clear">Clear</button>
      </div>

      <div class="adjust-row">
        <span class="adjust-row__label" data-i18n="tool.classroom-timer.labels.adjustWhileRunning">Adjust time (while running)</span>
        <button type="button" class="btn-action btn-adjust" data-adjust="10">+10s</button>
        <button type="button" class="btn-action btn-adjust" data-adjust="30">+30s</button>
        <button type="button" class="btn-action btn-adjust" data-adjust="60">+1m</button>
        <button type="button" class="btn-action btn-adjust btn-adjust--minus" data-adjust="-10">-10s</button>
        <button type="button" class="btn-action btn-adjust btn-adjust--minus" data-adjust="-30">-30s</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
