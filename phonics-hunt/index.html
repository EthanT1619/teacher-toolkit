<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단어 별 찾기</title>
  <link rel="stylesheet" href="../shared/toolkit-home.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="../shared/toolkit-home.js" defer></script>
</head>
<body>
  <div id="app">
    <!-- Setup Screen -->
    <section id="setup-screen" class="screen active">
      <header class="setup-header">
        <h1>⭐ 단어 별 찾기</h1>
        <p class="setup-subtitle">단어를 입력하면 자동으로 그리드가 만들어집니다</p>
      </header>

      <div class="setup-body">
        <div class="setup-panel">
          <h2>단어 입력</h2>
          <p class="hint">한 줄에 단어 하나씩 입력하세요.</p>
          <textarea id="word-input" rows="14" placeholder="apple&#10;banana&#10;cat&#10;dog&#10;elephant&#10;fish"></textarea>
          <div class="word-preview" id="word-preview">
            <span id="word-count">0</span>개 단어 ·
            <span id="grid-preview">그리드: —</span>
          </div>
        </div>

        <div class="setup-panel setup-side">
          <h2>게임 설정</h2>
          <label class="setting-row">
            <span>팀 이름 (파랑)</span>
            <input type="text" id="team-blue-name" value="Blue Team" maxlength="12">
          </label>
          <label class="setting-row">
            <span>팀 이름 (빨강)</span>
            <input type="text" id="team-red-name" value="Red Team" maxlength="12">
          </label>
          <label class="setting-row">
            <span>별 개수 (랜덤 배치)</span>
            <input type="number" id="star-count" min="1" max="64" value="3">
          </label>
          <label class="setting-row">
            <span>별 점수</span>
            <input type="number" id="star-points" min="1" max="10" value="1">
          </label>

          <div class="setup-actions">
            <button class="btn btn-primary" id="btn-start-game">게임 시작</button>
          </div>

          <div class="setup-tips">
            <h3>사용법</h3>
            <ul>
              <li>입력한 단어 수만큼 칸이 자동으로 배치됩니다</li>
              <li>단어는 처음부터 카드에 보입니다</li>
              <li>별 개수만 정하면 칸에 랜덤으로 숨겨집니다</li>
              <li>학생이 단어를 말하면 강사가 해당 칸을 엽니다</li>
              <li>별 칸을 열면 점수를 얻습니다</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- Game Screen -->
    <section id="game-screen" class="screen">
      <header class="scoreboard">
        <div class="team-score blue-team" id="blue-score-panel">
          <span class="team-label" id="blue-team-label">Blue Team</span>
          <span class="team-points" id="blue-score">0</span>
          <span class="team-sub">별 점수</span>
        </div>
        <div class="game-title">
          <h1>⭐ 단어 별 찾기</h1>
          <p class="status-text" id="status-text">팀을 선택하세요</p>
        </div>
        <div class="team-score red-team" id="red-score-panel">
          <span class="team-label" id="red-team-label">Red Team</span>
          <span class="team-points" id="red-score">0</span>
          <span class="team-sub">별 점수</span>
        </div>
      </header>

      <main class="grid-container" id="grid-container"></main>

      <div class="overlay hidden" id="victory-overlay">
        <div class="overlay-content victory-content">
          <div class="victory-icon">🏆</div>
          <h2 id="victory-title">게임 종료!</h2>
          <p id="victory-message"></p>
          <div class="victory-actions">
            <button class="btn btn-primary" id="victory-dismiss">계속하기</button>
            <button class="btn btn-secondary" id="btn-back-setup">단어 수정</button>
          </div>
        </div>
      </div>

      <footer class="controls">
        <div class="control-group excavate-group">
          <button class="btn btn-blue" id="btn-blue-excavate">
            <span class="btn-icon">🔵</span>
            <span id="btn-blue-text">Blue Team</span> 턴
          </button>
          <button class="btn btn-red" id="btn-red-excavate">
            <span class="btn-icon">🔴</span>
            <span id="btn-red-text">Red Team</span> 턴
          </button>
        </div>

        <div class="control-group map-settings">
          <span class="grid-info" id="grid-info">—</span>
          <button class="btn btn-secondary" id="btn-reset">점수 초기화</button>
          <button class="btn btn-secondary" id="btn-back-setup-footer">단어 수정</button>
        </div>

        <div class="control-group audio-group">
          <button class="btn btn-icon-only" id="btn-mute" title="소리 켜기/끄기">🔊</button>
          <button class="btn btn-icon-only" id="btn-fullscreen" title="전체 화면">⛶</button>
        </div>
      </footer>
    </section>

    <div class="toast hidden" id="toast"></div>
  </div>

  <script src="js/WordParser.js"></script>
  <script src="js/GridCalculator.js"></script>
  <script src="js/Tile.js"></script>
  <script src="js/Grid.js"></script>
  <script src="js/AnimationManager.js"></script>
  <script src="js/SoundManager.js"></script>
  <script src="js/UIManager.js"></script>
  <script src="js/Game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
