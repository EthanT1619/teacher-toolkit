<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 Mystery Box</title>
  <link rel="stylesheet" href="../shared/toolkit-home.css">
  <script src="../shared/toolkit-home.js" defer></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #f59e0b;
      --accent-light: #fef3c7;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08);
      --shadow-lg: 0 20px 40px -12px rgb(0 0 0 / 0.18);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f5f7fb 50%, #fef3c7 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
    }

    .view { display: none; min-height: 100vh; }
    .view.active { display: flex; flex-direction: column; }

    /* ── Setup ── */
    .setup-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 16px 48px;
      width: 100%;
    }

    header { text-align: center; margin-bottom: 28px; position: relative; }
    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    header p { color: var(--text-muted); margin-top: 6px; font-size: 0.95rem; }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    label.field-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .row input[type="number"] {
      width: 80px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
    }

    .row input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input { width: 18px; height: 18px; accent-color: var(--primary); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgb(79 70 229 / 0.35);
    }

    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { background: var(--border); }

    a.btn { text-decoration: none; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

    .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .preset-row select, .preset-row input {
      flex: 1;
      min-width: 140px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
    }

    .preset-row select:focus, .preset-row input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* ── Play (발표·교실용 크기) ── */
    .play-view {
      background: #ffffff;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      min-height: 100vh;
    }

    .play-toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgb(255 255 255 / 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
      opacity: 0;
      transform: translateY(-100%);
      transition: opacity 0.25s, transform 0.25s;
    }

    .play-view:hover .play-toolbar,
    .play-toolbar:focus-within,
    .play-toolbar.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .play-toolbar .status {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .icon-btn {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .icon-btn:hover { background: var(--bg); }

    a.icon-btn {
      text-decoration: none;
      color: var(--text);
      display: inline-flex;
      align-items: center;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .boxes-stage {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(28px, 5vmin, 72px);
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 96vw;
      flex: 1;
      padding: 16px 0 clamp(48px, 8vmin, 72px);
    }

    .box-slot {
      position: relative;
      width: clamp(180px, 26vmin, 320px);
      height: clamp(200px, 30vmin, 360px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .box-slot.revealed { cursor: default; }

    .prize-circle {
      position: absolute;
      width: clamp(150px, 22vmin, 280px);
      height: clamp(150px, 22vmin, 280px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(12px, 2vmin, 20px);
      font-size: clamp(2rem, 7vmin, 4.5rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #1e293b;
      box-shadow: inset 0 -4px 12px rgb(0 0 0 / 0.08), 0 6px 20px rgb(0 0 0 / 0.1);
      z-index: 1;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .box-slot:not(.revealed) .prize-circle {
      visibility: hidden;
    }

    .prize-circle.color-0 { background: linear-gradient(145deg, #fde68a, #fbbf24); }
    .prize-circle.color-1 { background: linear-gradient(145deg, #bfdbfe, #60a5fa); }
    .prize-circle.color-2 { background: linear-gradient(145deg, #bbf7d0, #4ade80); }
    .prize-circle.color-3 { background: linear-gradient(145deg, #fbcfe8, #f472b6); }
    .prize-circle.color-4 { background: linear-gradient(145deg, #ddd6fe, #a78bfa); }

    .prize-circle.reveal-pop {
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .mystery-cube {
      position: absolute;
      width: clamp(165px, 24vmin, 300px);
      height: clamp(165px, 24vmin, 300px);
      z-index: 2;
      transition: transform 0.35s ease, opacity 0.35s ease;
      filter: drop-shadow(0 12px 24px rgb(0 0 0 / 0.15));
      background: #f472b6;
      border-radius: 4px;
    }

    .box-slot:not(.revealed):hover .mystery-cube {
      transform: translateY(-6px) scale(1.03);
    }

    .box-slot.revealed .mystery-cube {
      transform: scale(0.3) rotate(20deg);
      opacity: 0;
      pointer-events: none;
    }

    .cube-svg { width: 100%; height: 100%; }

    .box-number {
      position: absolute;
      bottom: clamp(-32px, -5vmin, -52px);
      font-size: clamp(1.5rem, 4vmin, 2.5rem);
      font-weight: 800;
      color: #334155;
      z-index: 3;
    }

    /* 박스가 많을 때 자동 축소 */
    .boxes-stage[data-count="5"] .prize-circle { font-size: clamp(1.75rem, 6vmin, 3.75rem); }
    .boxes-stage[data-count="6"] .prize-circle,
    .boxes-stage[data-count="7"] .prize-circle,
    .boxes-stage[data-count="8"] .prize-circle { font-size: clamp(1.5rem, 5vmin, 3rem); }
    .boxes-stage[data-count="6"] .box-slot,
    .boxes-stage[data-count="7"] .box-slot,
    .boxes-stage[data-count="8"] .box-slot {
      width: clamp(150px, 20vmin, 260px);
      height: clamp(170px, 24vmin, 300px);
    }

    .play-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgb(30 41 59 / 0.85);
      color: white;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 5;
    }

    .play-hint.hidden { opacity: 0; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.4rem; }
      .actions { flex-direction: column; }
      .actions .btn { width: 100%; }
    }
  </style>
</head>
<body>

<!-- Setup -->
<section id="setupView" class="view active">
  <div class="setup-wrap">
    <header>
      <button type="button" class="btn btn-secondary" id="btn-language" data-i18n-aria="tool.mystery-box-picker.aria.switchLanguage" style="position:absolute;top:0;right:0;">한국어</button>
      <h1>🎁 <span data-i18n="tool.mystery-box-picker.title">Mystery Box</span></h1>
      <p data-i18n="tool.mystery-box-picker.subtitle">Enter items and start — click boxes to reveal them, like a presentation</p>
    </header>

    <div class="card">
      <div class="card-title" data-i18n="tool.mystery-box-picker.sections.items">Items</div>
      <label class="field-label" for="itemsInput" data-i18n="tool.mystery-box-picker.labels.itemsList">Box contents (one per line)</label>
      <textarea id="itemsInput" data-i18n-placeholder="tool.mystery-box-picker.placeholders.itemsList" placeholder="Switch points&#10;+6&#10;+1&#10;꽝&#10;×2"></textarea>
      <p class="hint" data-i18n="tool.mystery-box-picker.hints.itemsShuffle">One box is created per line; items are shuffled randomly each time you start.</p>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="tool.mystery-box-picker.sections.options">Options</div>
      <div class="row" style="margin-bottom: 12px;">
        <label class="checkbox-label">
          <input type="checkbox" id="shuffleEachRound" checked>
          <span data-i18n="tool.mystery-box-picker.labels.shuffleEachRound">Reshuffle each new round</span>
        </label>
      </div>
      <div class="row">
        <label class="checkbox-label">
          <input type="checkbox" id="hideToolbar" checked>
          <span data-i18n="tool.mystery-box-picker.labels.hideToolbar">Auto-hide top menu during presentation</span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="tool.mystery-box-picker.sections.preset">Preset</div>
      <div class="preset-row">
        <select id="presetSelect">
          <option value="" data-i18n="tool.mystery-box-picker.preset.selectPlaceholder">— Select preset —</option>
        </select>
        <button class="btn btn-secondary" id="loadPresetBtn" disabled data-i18n="tool.mystery-box-picker.actions.loadPreset">Load</button>
      </div>
      <div class="preset-row">
        <input type="text" id="presetNameInput" data-i18n-placeholder="tool.mystery-box-picker.placeholders.presetName" placeholder="Preset name (e.g. Class 3 score pick)" maxlength="30">
        <button class="btn btn-secondary" id="savePresetBtn" data-i18n="tool.mystery-box-picker.actions.savePreset">Save</button>
        <button class="btn btn-secondary" id="deletePresetBtn" disabled data-i18n="tool.mystery-box-picker.actions.deletePreset">Delete</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="startBtn" data-i18n="tool.mystery-box-picker.actions.start">▶ Start</button>
      <button class="btn btn-secondary" id="sampleBtn" data-i18n="tool.mystery-box-picker.actions.sampleLoad">Load Sample</button>
    </div>
  </div>
</section>

<!-- Play -->
<section id="playView" class="view play-view">
  <div class="play-toolbar" id="playToolbar">
    <div class="toolbar-left">
      <button class="icon-btn" id="backBtn" data-i18n="tool.mystery-box-picker.actions.backToSetup">← Setup</button>
    </div>
    <span class="status" id="statusText"></span>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="resetRoundBtn" data-i18n="tool.mystery-box-picker.actions.reshuffle" data-i18n-title="tool.mystery-box-picker.aria.reshuffle">↻ Reshuffle</button>
      <button class="icon-btn" id="fullscreenBtn" data-i18n="tool.mystery-box-picker.actions.fullscreen" data-i18n-title="tool.mystery-box-picker.aria.fullscreen">⛶ Fullscreen</button>
    </div>
  </div>

  <div class="boxes-stage" id="boxesStage"></div>
  <div class="play-hint" id="playHint" data-i18n="tool.mystery-box-picker.playHint">Click a box to reveal its contents · R: reshuffle · Esc: setup</div>
</section>

<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
