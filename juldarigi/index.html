<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tug of War</title>
  <link rel="stylesheet" href="../shared/toolkit-home.css">
  <script src="../shared/toolkit-home.js" defer></script>
  <style>
    :root {
      --bg: #f0fdf4;
      --surface: #ffffff;
      --team-a: #2563eb;
      --team-a-light: #dbeafe;
      --team-b: #dc2626;
      --team-b-light: #fee2e2;
      --grass: #22c55e;
      --grass-dark: #16a34a;
      --rope: #92400e;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(180deg, #ecfdf5 0%, var(--bg) 40%, #fef9c3 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
    }

    .view { display: none; min-height: 100vh; }
    .view.active { display: flex; flex-direction: column; }

    /* ── Setup ── */
    .setup-wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 16px 48px;
      width: 100%;
    }

    .setup-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    header { text-align: center; margin-bottom: 28px; }
    header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--grass-dark);
      letter-spacing: -0.02em;
    }
    header p { color: var(--text-muted); margin-top: 8px; font-size: 0.95rem; }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--grass);
    }

    .hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 13px 22px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-start {
      width: 100%;
      background: linear-gradient(180deg, var(--grass), var(--grass-dark));
      color: white;
      margin-top: 8px;
      box-shadow: 0 4px 0 #15803d;
    }

    .btn-start:hover { filter: brightness(1.06); }

    /* ── Play ── */
    .play-view { flex: 1; }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgb(255 255 255 / 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .icon-btn {
      padding: 8px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: white;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
    }

    .icon-btn:hover { border-color: var(--grass); }

    .status-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      flex: 1;
      padding: 0 12px;
    }

    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 16px 32px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .score-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .team-score {
      padding: 14px 16px;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .team-score.a {
      background: var(--team-a-light);
      border: 2px solid var(--team-a);
    }

    .team-score.b {
      background: var(--team-b-light);
      border: 2px solid var(--team-b);
    }

    .team-score .name {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .team-score.a .name { color: var(--team-a); }
    .team-score.b .name { color: var(--team-b); }

    .team-score .pts {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.2;
    }

    .vs-badge {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
      background: white;
      border: 2px solid var(--border);
      border-radius: 999px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Tug field ── */
    .tug-field {
      position: relative;
      background: linear-gradient(180deg, #86efac 0%, var(--grass) 30%, var(--grass-dark) 100%);
      border-radius: var(--radius);
      padding: 48px 16px 36px;
      margin-bottom: 24px;
      box-shadow: inset 0 4px 12px rgb(0 0 0 / 0.15), var(--shadow);
      overflow: hidden;
    }

    .tug-field::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 28px,
        rgb(255 255 255 / 0.06) 28px,
        rgb(255 255 255 / 0.06) 30px
      );
      pointer-events: none;
    }

    .center-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      background: rgb(255 255 255 / 0.7);
      transform: translateX(-50%);
      z-index: 1;
    }

    .center-line-label {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      font-weight: 700;
      color: white;
      background: rgb(0 0 0 / 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .win-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 12%;
      opacity: 0.25;
      z-index: 0;
    }

    .win-zone.left {
      left: 0;
      background: var(--team-a);
    }

    .win-zone.right {
      right: 0;
      background: var(--team-b);
    }

    .team-label {
      position: absolute;
      top: 12px;
      font-size: 0.8rem;
      font-weight: 800;
      color: white;
      text-shadow: 0 1px 3px rgb(0 0 0 / 0.4);
      z-index: 2;
    }

    .team-label.left { left: 16px; }
    .team-label.right { right: 16px; }

    .rope-track {
      position: relative;
      height: 80px;
      z-index: 2;
    }

    .rope {
      position: absolute;
      top: 50%;
      left: 5%;
      right: 5%;
      height: 10px;
      background: linear-gradient(180deg, #b45309, var(--rope));
      border-radius: 5px;
      transform: translateY(-50%);
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.3);
    }

    .rope::before,
    .rope::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: rgb(255 255 255 / 0.5);
      border: 2px solid var(--rope);
    }

    .rope::before { left: -6px; }
    .rope::after { right: -6px; }

    .flag {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 3;
    }

    .flag-pole {
      width: 4px;
      height: 52px;
      background: #475569;
      margin: 0 auto;
      border-radius: 2px;
    }

    .flag-cloth {
      position: absolute;
      top: 0;
      left: 4px;
      width: 28px;
      height: 20px;
      background: #fbbf24;
      border-radius: 0 4px 4px 0;
      box-shadow: 1px 1px 3px rgb(0 0 0 / 0.2);
    }

    .position-label {
      text-align: center;
      margin-top: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: white;
      text-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
      position: relative;
      z-index: 2;
    }

    /* ── Input panel ── */
    .input-panel {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: end;
    }

    .team-input-box {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .team-input-box.a { border-top: 4px solid var(--team-a); }
    .team-input-box.b { border-top: 4px solid var(--team-b); }

    .team-input-box .label {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .team-input-box.a .label { color: var(--team-a); }
    .team-input-box.b .label { color: var(--team-b); }

    .num-input {
      width: 100%;
      padding: 14px;
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
    }

    .team-input-box.a .num-input:focus {
      outline: none;
      border-color: var(--team-a);
    }

    .team-input-box.b .num-input:focus {
      outline: none;
      border-color: var(--team-b);
    }

    .pull-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-bottom: 4px;
    }

    .btn-pull {
      background: linear-gradient(180deg, #fbbf24, #d97706);
      color: white;
      padding: 16px 20px;
      font-size: 1.05rem;
      box-shadow: 0 4px 0 #b45309;
      white-space: nowrap;
    }

    .btn-pull:hover { filter: brightness(1.06); }

    .pull-hint {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
    }

    .round-log {
      margin-top: 20px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .round-log h3 {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .log-list {
      max-height: 140px;
      overflow-y: auto;
      font-size: 0.88rem;
    }

    .log-item {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .log-item:last-child { border-bottom: none; }

    .log-item .delta-a { color: var(--team-a); font-weight: 700; }
    .log-item .delta-b { color: var(--team-b); font-weight: 700; }

    /* ── Win overlay ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgb(0 0 0 / 0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .overlay.show { display: flex; }

    .overlay-card {
      background: white;
      border-radius: var(--radius);
      padding: 36px 28px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: var(--shadow);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .overlay-card .emoji { font-size: 3rem; margin-bottom: 12px; }
    .overlay-card h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .overlay-card p { color: var(--text-muted); margin-bottom: 20px; }

    .overlay-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-secondary {
      background: white;
      border: 2px solid var(--border);
      color: var(--text);
    }

    .btn-primary {
      background: var(--grass);
      color: white;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: rgb(30 41 59 / 0.92);
      color: white;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 200;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
      .input-panel {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }

      .pull-btn-wrap { order: 3; padding: 8px 0; }
      .team-input-box.a { order: 1; }
      .team-input-box.b { order: 2; }

      .btn-pull { width: 100%; }

      .score-row {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
      }

      .vs-badge {
        grid-column: 1 / -1;
        justify-self: center;
      }
    }
  </style>
</head>
<body>

<!-- 설정 -->
<section id="setupView" class="view active">
  <div class="setup-wrap">
    <div class="setup-actions">
      <button class="icon-btn" id="btn-language" type="button" data-i18n-aria="tool.juldarigi.aria.switchLanguage">한국어</button>
    </div>
    <header>
      <h1 data-i18n="tool.juldarigi.title">Tug of War</h1>
      <p data-i18n="tool.juldarigi.subtitle">Draw cards, enter team scores, and pull the rope — first to pull the opponent across wins!</p>
    </header>

    <div class="card">
      <div class="card-title" data-i18n="tool.juldarigi.setup.teamNames">Team names</div>
      <div class="field-row">
        <div>
          <label class="field-label" for="teamAName" data-i18n="tool.juldarigi.setup.teamALabel">Team A (left)</label>
          <input type="text" id="teamAName" data-i18n-placeholder="tool.juldarigi.setup.teamAPlaceholder" placeholder="e.g. Class 1" maxlength="12">
        </div>
        <div>
          <label class="field-label" for="teamBName" data-i18n="tool.juldarigi.setup.teamBLabel">Team B (right)</label>
          <input type="text" id="teamBName" data-i18n-placeholder="tool.juldarigi.setup.teamBPlaceholder" placeholder="e.g. Class 2" maxlength="12">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="tool.juldarigi.setup.winCondition">Win condition</div>
      <label class="field-label" for="winPoints" data-i18n="tool.juldarigi.setup.winPointsLabel">Points needed to win</label>
      <input type="number" id="winPoints" min="5" max="100" value="30">
      <p class="hint" data-i18n="tool.juldarigi.setup.winPointsHint">Teams take turns entering card scores (1–9). Win when the cumulative difference reaches this value.</p>
    </div>

    <button class="btn btn-start" id="startBtn" data-i18n="tool.juldarigi.actions.startGame">▶ Start Game</button>
  </div>
</section>

<!-- 플레이 -->
<section id="playView" class="view play-view">
  <div class="top-bar">
    <button class="icon-btn" id="backBtn" data-i18n="tool.juldarigi.actions.backToSetup">← Setup</button>
    <span class="status-text" id="statusText"></span>
    <button class="icon-btn" id="resetBtn" data-i18n="tool.juldarigi.actions.reset">↻ Reset</button>
  </div>

  <div class="game-area">
    <div class="score-row">
      <div class="team-score a">
        <div class="name" id="scoreAName"></div>
        <div class="pts"><span id="scoreA">0</span></div>
      </div>
      <div class="vs-badge" data-i18n="tool.juldarigi.play.vs">VS</div>
      <div class="team-score b">
        <div class="name" id="scoreBName"></div>
        <div class="pts"><span id="scoreB">0</span></div>
      </div>
    </div>

    <div class="tug-field">
      <div class="win-zone left"></div>
      <div class="win-zone right"></div>
      <div class="center-line"><span class="center-line-label" data-i18n="tool.juldarigi.play.center">Center</span></div>
      <div class="team-label left" id="fieldAName"></div>
      <div class="team-label right" id="fieldBName"></div>

      <div class="rope-track">
        <div class="rope"></div>
        <div class="flag" id="flag">
          <div class="flag-pole"></div>
          <div class="flag-cloth"></div>
        </div>
      </div>

      <div class="position-label" id="positionLabel"></div>
    </div>

    <div class="input-panel">
      <div class="team-input-box a">
        <div class="label" id="inputAName"></div>
        <input type="number" class="num-input" id="inputA" min="0" max="9" placeholder="0" inputmode="numeric">
      </div>

      <div class="pull-btn-wrap">
        <button class="btn btn-pull" id="pullBtn" data-i18n="tool.juldarigi.actions.pull">Pull!</button>
        <span class="pull-hint" data-i18n="tool.juldarigi.play.pullHint">Press Enter to apply</span>
      </div>

      <div class="team-input-box b">
        <div class="label" id="inputBName"></div>
        <input type="number" class="num-input" id="inputB" min="0" max="9" placeholder="0" inputmode="numeric">
      </div>
    </div>

    <div class="round-log">
      <h3 data-i18n="tool.juldarigi.play.roundLog">Round log</h3>
      <div class="log-list" id="logList"></div>
    </div>
  </div>
</section>

<!-- 승리 -->
<div class="overlay" id="winOverlay">
  <div class="overlay-card">
    <div class="emoji">🎉</div>
    <h2 id="winTitle"></h2>
    <p id="winDesc"></p>
    <div class="overlay-actions">
      <button class="btn btn-secondary" id="winBackBtn" data-i18n="tool.juldarigi.actions.toSetup">Back to Setup</button>
      <button class="btn btn-primary" id="winRematchBtn" data-i18n="tool.juldarigi.actions.rematch">Play Again</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
