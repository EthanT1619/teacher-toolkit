<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Score Board</title>
  <link rel="stylesheet" href="../shared/toolkit-home.css">
  <script src="../shared/toolkit-home.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --panel: #16213e;
      --accent1: #e94560;
      --accent2: #0f3460;
      --text: #eaeaea;
      --muted: #a0a0b0;
      --btn-size: 64px;
      --radius: 16px;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Settings Screen ── */
    #settings {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 24px;
      padding: 32px;
      position: relative;
    }

    .settings-top {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
    }

    .btn-language {
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      background: var(--accent2);
      color: var(--text);
      min-height: 40px;
      border: none;
      cursor: pointer;
    }

    #settings h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .settings-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }

    .settings-form label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 1rem;
      color: var(--muted);
    }

    .settings-form input {
      padding: 14px 16px;
      font-size: 1.2rem;
      border: 2px solid var(--accent2);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      outline: none;
    }

    .settings-form input:focus {
      border-color: var(--accent1);
    }

    .settings-hint {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .btn-start {
      margin-top: 8px;
      padding: 18px;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      background: var(--accent1);
      color: #fff;
      cursor: pointer;
      min-height: 60px;
    }

    .btn-start:active { opacity: 0.85; }

    /* ── Main Scoreboard ── */
    #scoreboard {
      display: none;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      padding-left: max(118px, calc(108px + env(safe-area-inset-left)));
      padding-top: max(8px, env(safe-area-inset-top));
      background: var(--panel);
      flex-shrink: 0;
      gap: 8px;
    }

    .top-bar button {
      padding: 8px 14px;
      font-size: clamp(0.8rem, 2.5cqi, 1rem);
      border: none;
      border-radius: 10px;
      background: var(--accent2);
      color: var(--text);
      cursor: pointer;
      min-height: 40px;
      white-space: nowrap;
    }

    .top-bar button:active { opacity: 0.85; }

    .teams-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--panel);
      border-bottom: 2px solid var(--accent2);
      flex-shrink: 0;
      position: relative;
      z-index: 50;
    }

    .teams-header .team-header {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-center {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .btn-menu {
      width: 44px;
      height: 44px;
      border: 2px solid var(--accent2);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-menu:active,
    .btn-menu.open {
      background: var(--accent2);
    }

    .menu-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.45);
    }

    .menu-backdrop.show { display: block; }

    .menu-popup {
      display: none;
      position: fixed;
      top: auto;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      min-width: 220px;
      max-width: min(90vw, 320px);
      background: var(--panel);
      border: 2px solid var(--accent2);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .menu-popup.show { display: flex; flex-direction: column; gap: 6px; }

    .menu-popup button {
      padding: 14px 12px;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      line-height: 1.3;
      min-height: 48px;
    }

    .menu-popup button:active { opacity: 0.85; }

    .menu-popup button.danger {
      background: #3a2040;
      color: #ff8fa3;
    }

    .menu-popup button.swap {
      background: #1a3050;
      color: #8ec5ff;
    }

    .teams {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      container-type: inline-size;
      container-name: team;
    }

    .team:first-child {
      border-right: 2px solid var(--accent2);
    }

    .team-header {
      text-align: center;
      padding: clamp(4px, 1.5cqi, 10px) 8px;
      font-size: clamp(1rem, 6cqi, 1.4rem);
      font-weight: 700;
      background: var(--panel);
      flex-shrink: 0;
    }

    .team-a .team-header { color: #ff6b8a; }
    .team-b .team-header { color: #6bb5ff; }

    /* Score area — 상단, 크게 */
    .score-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 6px;
      min-height: 0;
      overflow: hidden;
    }

    .score-controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      justify-items: center;
      gap: clamp(4px, 2cqi, 12px);
      width: 100%;
      max-width: 100%;
      padding: 0 4px;
    }

    .score-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      width: 100%;
    }

    .bomb-track {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, 1.5cqi, 8px);
      min-height: clamp(14px, 4.5cqi, 22px);
      margin-top: clamp(2px, 1cqi, 6px);
    }

    .bomb-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(26px, 9cqi, 36px);
      height: clamp(26px, 9cqi, 36px);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      font-size: clamp(0.8rem, 4.8cqi, 1.05rem);
      line-height: 1;
      flex-shrink: 0;
    }

    .score-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 1.5cqi, 8px);
      flex-shrink: 0;
    }

    .score-helpers {
      display: flex;
      gap: clamp(3px, 1.2cqi, 6px);
    }

    .btn-helper {
      min-width: clamp(34px, 13cqi, 50px);
      height: clamp(28px, 9cqi, 38px);
      padding: 0 clamp(4px, 1cqi, 8px);
      border: none;
      border-radius: 8px;
      font-size: clamp(0.65rem, 3.8cqi, 0.85rem);
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .btn-helper:active { transform: scale(0.94); opacity: 0.9; }

    .btn-helper-minus {
      background: #2a2a48;
      color: #c8c8d8;
      border: 1px solid #4a4a6a;
    }

    .btn-helper-plus {
      background: #4a2030;
      color: #ffb3c1;
      border: 1px solid #7a3050;
    }

    .score-display {
      font-size: clamp(2.75rem, min(42cqi, 31dvh), 12.1rem);
      font-weight: 800;
      line-height: 1;
      text-align: center;
      letter-spacing: -1px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-circle {
      border: none;
      border-radius: 50%;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
    }

    .btn-circle:active { transform: scale(0.92); }

    .btn-minus {
      background: #3a3a5c;
      color: var(--text);
    }

    .btn-plus {
      background: var(--accent1);
      color: #fff;
    }

    .btn-score {
      width: clamp(36px, 18cqi, 96px);
      height: clamp(36px, 18cqi, 96px);
      font-size: clamp(1.2rem, 7cqi, 2.5rem);
    }

    /* Resources — 하단 3칸 네모 */
    .resources {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: stretch;
      gap: clamp(2px, 1.1cqi, 6px);
      padding: clamp(8px, 2cqi, 12px) clamp(4px, 1.1cqi, 6px);
      padding-bottom: max(clamp(6px, 1.4cqi, 8px), env(safe-area-inset-bottom));
      background: var(--panel);
      border-top: 2px solid var(--accent2);
      max-height: min(26dvh, 178px);
    }

    .resource-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--accent2);
      border-radius: clamp(6px, 1.5cqi, 10px);
      padding: clamp(6px, 1.6cqi, 10px) clamp(2px, 0.8cqi, 4px) clamp(6px, 1.4cqi, 10px);
      gap: clamp(4px, 1.2cqi, 8px);
      min-width: 0;
      min-height: clamp(104px, 32cqi, 138px);
      box-sizing: border-box;
    }

    .resource-label {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, 1cqi, 6px);
      font-size: clamp(1.35rem, 8.5cqi, 2.25rem);
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      padding-top: clamp(2px, 0.6cqi, 4px);
      flex-wrap: wrap;
    }

    .resource-name {
      font-size: inherit;
      line-height: inherit;
      font-weight: inherit;
    }

    .resource-value {
      font-size: clamp(0.85rem, 6.5cqi, 1.6rem);
      font-weight: 800;
      line-height: 1;
    }

    .resource-btns {
      display: flex;
      gap: clamp(2px, 1cqi, 4px);
      align-items: center;
      flex-shrink: 0;
      margin-top: auto;
    }

    .btn-resource {
      width: clamp(28px, 11cqi, 44px);
      height: clamp(31px, 12cqi, 48px);
      font-size: clamp(0.85rem, 5cqi, 1.25rem);
    }

    /* 세로 모드 — 가로 배치 유지, 크기만 축소 */
    @media (orientation: portrait) {
      .score-controls {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: clamp(3px, 1.5cqi, 8px);
      }

      .score-side {
        gap: clamp(3px, 1.2cqi, 6px);
      }

      .score-center {
        flex: 1;
        min-width: 0;
      }

      .score-display {
        flex: none;
        min-width: 0;
        font-size: clamp(2.2rem, min(33cqi, 15.4dvh), 7.7rem);
      }

      .btn-score {
        width: clamp(34px, 14cqi, 68px);
        height: clamp(34px, 14cqi, 68px);
        font-size: clamp(1rem, 5.5cqi, 1.8rem);
        flex-shrink: 0;
      }

      .btn-helper {
        min-width: clamp(30px, 11cqi, 44px);
        height: clamp(26px, 8cqi, 34px);
        font-size: clamp(0.6rem, 3.2cqi, 0.8rem);
      }

      .resource-label {
        font-size: clamp(1.1rem, 7cqi, 1.75rem);
      }

      .resource-value {
        font-size: clamp(0.75rem, 6cqi, 1.35rem);
      }

      .btn-resource {
        width: clamp(24px, 10cqi, 38px);
        height: clamp(27px, 11cqi, 42px);
        font-size: clamp(0.8rem, 4.5cqi, 1.1rem);
      }

      .resources {
        padding-top: clamp(7px, 1.8cqi, 10px);
        max-height: min(24dvh, 158px);
      }

      .resource-box {
        min-height: clamp(96px, 29cqi, 124px);
        padding-top: clamp(5px, 1.4cqi, 8px);
        padding-bottom: clamp(5px, 1.3cqi, 8px);
      }
    }

    /* 모바일 가로 모드 — 높이가 낮을 때 */
    @media (orientation: landscape) and (max-height: 500px) {
      .top-bar {
        padding: 4px 10px;
        padding-left: max(104px, calc(96px + env(safe-area-inset-left)));
        padding-top: max(4px, env(safe-area-inset-top));
      }

      .top-bar button {
        min-height: 34px;
        padding: 4px 10px;
        font-size: 0.8rem;
      }

      .team-header {
        padding: 3px 6px;
        font-size: 0.95rem;
      }

      .btn-menu {
        width: 38px;
        height: 38px;
        font-size: 1rem;
      }

      .score-display {
        font-size: clamp(2.2rem, min(35cqi, 24dvh), 5.5rem);
      }

      .btn-score {
        width: clamp(40px, 18cqi, 72px);
        height: clamp(40px, 18cqi, 72px);
      }

      .resources {
        padding: 7px 4px 4px;
        padding-bottom: max(4px, env(safe-area-inset-bottom));
        max-height: min(30dvh, 142px);
      }

      .resource-box {
        padding: 5px 2px 5px;
        gap: 4px;
        min-height: clamp(84px, 25cqi, 108px);
      }

      .btn-resource {
        width: clamp(24px, 10cqi, 36px);
        height: clamp(27px, 11cqi, 40px);
      }
    }

  </style>
</head>
<body>

  <!-- Settings -->
  <div id="settings">
    <div class="settings-top">
      <button type="button" class="btn-language" id="btn-language" data-i18n-aria="tool.edu-scoreboard.aria.switchLanguage">한국어</button>
    </div>
    <h1 data-i18n="tool.edu-scoreboard.settingsTitle">Team setup</h1>
    <form class="settings-form" id="settingsForm">
      <label>
        <span data-i18n="tool.edu-scoreboard.labels.team1Name">Team 1 name</span>
        <input type="text" id="team1Name" placeholder="Team 1" value="Team 1" maxlength="20">
      </label>
      <label>
        <span data-i18n="tool.edu-scoreboard.labels.team2Name">Team 2 name</span>
        <input type="text" id="team2Name" placeholder="Team 2" value="Team 2" maxlength="20">
      </label>
      <label>
        <span data-i18n="tool.edu-scoreboard.labels.bombCount">Bomb count</span>
        <input type="number" id="bombCount" min="1" max="5" value="1" inputmode="numeric">
        <span class="settings-hint" data-i18n="tool.edu-scoreboard.hints.bombCount">1 = score resets immediately · 2–5 = 💣 accumulates before reset</span>
      </label>
      <button type="submit" class="btn-start" data-i18n="tool.edu-scoreboard.actions.start">Start</button>
    </form>
  </div>

  <!-- Scoreboard -->
  <div id="scoreboard">
    <div class="top-bar">
      <button id="btnBack" data-i18n="tool.edu-scoreboard.actions.backToSettings">← Settings</button>
      <button id="btnReset" data-i18n="tool.edu-scoreboard.actions.resetScores">Reset scores</button>
    </div>
    <div class="teams-header">
      <div class="team-header team-a" id="headerTeamA">Team 1</div>
      <div class="header-center">
        <button type="button" class="btn-menu" id="btnMenu" data-i18n-aria="tool.edu-scoreboard.aria.menu">☰</button>
        <div class="menu-popup" id="menuPopup">
          <button type="button" class="danger" id="btnBomb1"></button>
          <button type="button" class="danger" id="btnBomb2"></button>
          <button type="button" class="swap" id="btnSwitchPoint" data-i18n="tool.edu-scoreboard.actions.switchPoint">Switch Point</button>
          <button type="button" class="swap" id="btnSwitchAll" data-i18n="tool.edu-scoreboard.actions.switchEverything">Switch Everything</button>
        </div>
      </div>
      <div class="team-header team-b" id="headerTeamB">Team 2</div>
    </div>
    <div class="menu-backdrop" id="menuBackdrop"></div>
    <div class="teams">
      <div class="team team-a" id="teamA"></div>
      <div class="team team-b" id="teamB"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
