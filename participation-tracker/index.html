<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Participation Tracker</title>
  <link rel="stylesheet" href="../shared/toolkit-home.css">
  <script src="../shared/toolkit-home.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --panel: #16213e;
      --accent1: #e94560;
      --accent2: #0f3460;
      --accent3: #53d8a8;
      --text: #eaeaea;
      --muted: #a0a0b0;
      --radius: 16px;
      --quiet: #3d2a4a;
      --quiet-border: #c77dff;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:active:not(.student-card) { opacity: 0.85; }

    .screen {
      display: none;
      flex-direction: column;
      min-height: 100%;
      min-height: 100dvh;
    }

    .screen.active { display: flex; }

    /* ── Settings ── */
    #settings {
      align-items: center;
      padding: 24px 20px 40px;
      gap: 20px;
      overflow-y: auto;
    }

    .settings-header {
      text-align: center;
      width: 100%;
      max-width: 520px;
    }

    .settings-header-top {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      max-width: 520px;
      margin-bottom: 4px;
    }

    .btn-language {
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      background: var(--accent2);
      color: var(--text);
      min-height: 40px;
    }

    .settings-header h1 {
      font-size: 1.75rem;
      margin-bottom: 6px;
    }

    .settings-header p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 2px solid var(--accent2);
      border-radius: var(--radius);
      padding: 18px;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    .card label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    textarea, input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid var(--accent2);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus, input[type="text"]:focus, select:focus {
      border-color: var(--accent1);
    }

    .hint {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .preset-active {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent3);
      margin-bottom: 12px;
      padding: 8px 12px;
      background: rgba(83, 216, 168, 0.1);
      border-radius: 10px;
    }

    .preset-active.muted {
      color: var(--muted);
      background: var(--bg);
      font-weight: 500;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .row:last-child { margin-bottom: 0; }

    .row select { flex: 1; min-width: 140px; }
    .row input[type="text"] { flex: 1; min-width: 120px; }

    .btn {
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 12px;
      min-height: 44px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent1);
      color: #fff;
    }

    .btn-secondary {
      background: var(--accent2);
      color: var(--text);
    }

    .btn-ghost {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--accent2);
    }

    .btn-danger {
      background: #3a2040;
      color: #ff8fa3;
    }

    .btn-start {
      width: 100%;
      max-width: 520px;
      padding: 18px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: var(--radius);
      background: var(--accent1);
      color: #fff;
      min-height: 56px;
    }

    .student-count {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--accent3);
      font-weight: 600;
    }

    /* ── Tracker ── */
    #tracker {
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top));
      background: var(--panel);
      border-bottom: 2px solid var(--accent2);
      flex-shrink: 0;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .top-bar button {
      padding: 8px 14px;
      font-size: 0.9rem;
      border-radius: 10px;
      background: var(--accent2);
      color: var(--text);
      min-height: 40px;
    }

    .top-bar .btn-reset {
      background: #3a2040;
      color: #ff8fa3;
    }

    .top-bar .btn-undo {
      background: #2a3a50;
      color: #8ec5ff;
    }

    .top-bar .btn-undo:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .summary-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: #12182a;
      border-bottom: 1px solid var(--accent2);
      flex-shrink: 0;
      font-size: 0.9rem;
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .summary-dot.quiet { background: var(--quiet-border); }
    .summary-dot.ok { background: var(--accent3); }

    .summary-item strong {
      color: var(--text);
    }

    .summary-item span {
      color: var(--muted);
    }

    .sort-toggle {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .sort-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent1);
    }

    .student-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .student-card {
      width: 100%;
      min-height: 112px;
      background: var(--panel);
      border: 2px solid var(--accent2);
      border-radius: 14px;
      padding: 12px 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      align-items: center;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .student-card.quiet {
      background: var(--quiet);
      border-color: var(--quiet-border);
      box-shadow: 0 0 0 1px rgba(199, 125, 255, 0.25);
    }

    .student-card:active {
      transform: scale(0.98);
      border-color: var(--accent1);
      opacity: 1;
    }

    .student-card.quiet:active {
      border-color: var(--quiet-border);
    }

    .student-card.tapped {
      animation: tap-pulse 0.35s ease;
    }

    @keyframes tap-pulse {
      0% { border-color: var(--accent2); box-shadow: none; }
      40% { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.35); }
      100% { border-color: var(--accent2); box-shadow: none; }
    }

    .student-card.quiet.tapped {
      animation-name: tap-pulse-quiet;
    }

    @keyframes tap-pulse-quiet {
      0% { border-color: var(--quiet-border); box-shadow: 0 0 0 1px rgba(199, 125, 255, 0.25); }
      40% { border-color: #e0aaff; box-shadow: 0 0 0 3px rgba(199, 125, 255, 0.4); }
      100% { border-color: var(--quiet-border); box-shadow: 0 0 0 1px rgba(199, 125, 255, 0.25); }
    }

    .quiet-badge {
      display: none;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--quiet-border);
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .student-card.quiet .quiet-badge { display: block; }

    .student-name {
      width: 100%;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.3;
      word-break: keep-all;
      overflow-wrap: anywhere;
      user-select: none;
      pointer-events: none;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    }

    .hand-count {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1;
      color: var(--accent3);
      pointer-events: none;
      user-select: none;
    }

    .hand-count-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      pointer-events: none;
      user-select: none;
    }

    .student-card.holding {
      border-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.3);
    }

    .student-card.long-pressed {
      animation: long-press-pulse 0.35s ease;
    }

    @keyframes long-press-pulse {
      0% { border-color: var(--accent2); box-shadow: none; }
      40% { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.4); }
      100% { border-color: var(--accent2); box-shadow: none; }
    }

    .student-card.quiet.long-pressed {
      animation-name: long-press-pulse-quiet;
    }

    @keyframes long-press-pulse-quiet {
      0% { border-color: var(--quiet-border); box-shadow: 0 0 0 1px rgba(199, 125, 255, 0.25); }
      40% { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.4); }
      100% { border-color: var(--quiet-border); box-shadow: 0 0 0 1px rgba(199, 125, 255, 0.25); }
    }

    .tap-hint {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2a2a48;
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: transform 0.25s, opacity 0.25s;
      z-index: 100;
      pointer-events: none;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (min-width: 600px) {
      .student-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
        padding: 16px;
      }

      .student-card {
        min-height: 120px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .settings-header h1 { font-size: 1.4rem; }
      textarea { min-height: 120px; }
      .student-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 8px;
        padding: 8px;
      }

      .student-card {
        min-height: 96px;
        padding: 8px 6px 10px;
      }

      .student-name { font-size: 1rem; }
      .hand-count { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Settings -->
  <div id="settings" class="screen active">
    <div class="settings-header-top">
      <button type="button" class="btn-language" id="btn-language" data-i18n-aria="tool.participation-tracker.aria.switchLanguage">한국어</button>
    </div>
    <div class="settings-header">
      <h1 data-i18n="tool.participation-tracker.title">Participation Tracker</h1>
      <p data-i18n="tool.participation-tracker.description">Helps everyone get at least one more turn to practice.</p>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="tool.participation-tracker.sections.studentList">Student list</div>
      <label>
        <span data-i18n="tool.participation-tracker.labels.studentNames">Enter names (one per line)</span>
        <textarea id="studentInput" data-i18n-placeholder="tool.participation-tracker.placeholders.studentNames" placeholder="Alex&#10;Brandon&#10;Charlie&#10;Dexter&#10;..."></textarea>
      </label>
      <p class="hint" data-i18n="tool.participation-tracker.hints.studentNames">Commas or spaces also work. Empty lines are ignored.</p>
      <div class="student-count" id="studentCountLabel">0 students</div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="tool.participation-tracker.sections.preset">Preset</div>
      <div class="preset-active muted" id="activePresetLabel" data-i18n="tool.participation-tracker.preset.activeNone">Current preset: None</div>
      <div class="row">
        <select id="presetSelect">
          <option value="" data-i18n="tool.participation-tracker.preset.selectPlaceholder">— Select preset —</option>
        </select>
        <button type="button" class="btn btn-secondary" id="loadPresetBtn" disabled data-i18n="tool.participation-tracker.actions.loadPreset">Load</button>
      </div>
      <div class="row">
        <input type="text" id="presetNameInput" data-i18n-placeholder="tool.participation-tracker.placeholders.presetName" placeholder="Preset name (e.g. Wed 4:30 PM class)" maxlength="30" autocomplete="off">
        <button type="button" class="btn btn-secondary" id="savePresetBtn" data-i18n="tool.participation-tracker.actions.savePreset">Save new</button>
      </div>
      <div class="row">
        <button type="button" class="btn btn-ghost" id="updatePresetBtn" disabled data-i18n="tool.participation-tracker.actions.updatePreset">Update current preset</button>
        <button type="button" class="btn btn-danger" id="deletePresetBtn" disabled data-i18n="tool.participation-tracker.actions.deletePreset">Delete preset</button>
      </div>
    </div>

    <button type="button" class="btn-start" id="btnStart" data-i18n="tool.participation-tracker.actions.startClass">Start class</button>
  </div>

  <!-- Tracker -->
  <div id="tracker" class="screen">
    <div class="top-bar">
      <div class="top-bar-left">
        <button type="button" id="btnBack" data-i18n="tool.participation-tracker.actions.backToSettings">← Settings</button>
        <button type="button" class="btn-undo" id="btnUndo" disabled data-i18n="tool.participation-tracker.actions.undo">↩ Undo</button>
      </div>
      <div class="top-bar-right">
        <button type="button" class="btn-reset" id="btnReset" data-i18n="tool.participation-tracker.actions.resetSession">Reset this session</button>
      </div>
    </div>

    <div class="summary-bar">
      <div class="summary-item">
        <span class="summary-dot quiet"></span>
        <span id="quietSummary">Hands not raised 0</span>
      </div>
      <div class="summary-item">
        <span class="summary-dot ok"></span>
        <span id="activeSummary">Hands raised 0</span>
      </div>
      <span class="tap-hint" data-i18n="tool.participation-tracker.hints.tap">Tap +1 · Long press −1</span>
      <label class="sort-toggle">
        <input type="checkbox" id="sortQuietFirst" checked>
        <span data-i18n="tool.participation-tracker.labels.sortQuietFirst">Quiet students first</span>
      </label>
    </div>

    <div class="student-grid" id="studentGrid"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
