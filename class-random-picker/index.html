<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 Random Picker</title>
  <link rel="stylesheet" href="../shared/toolkit-home.css">
  <script src="../shared/toolkit-home.js" defer></script>
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #f59e0b;
      --accent-light: #fef3c7;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.06);
      --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.06);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f0f4f8 50%, #fef3c7 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    header {
      text-align: center;
      flex: 1;
      min-width: 200px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }

    .picker-zone {
      text-align: center;
      padding: 32px 16px;
      background: linear-gradient(180deg, var(--primary-light) 0%, var(--surface) 100%);
      border-radius: var(--radius);
      border: 2px dashed var(--border);
      margin-bottom: 20px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, background 0.3s;
    }

    .picker-zone.spinning {
      border-color: var(--primary);
      background: linear-gradient(180deg, #ddd6fe 0%, var(--primary-light) 100%);
    }

    .picker-zone.winner {
      border-color: var(--accent);
      background: linear-gradient(180deg, var(--accent-light) 0%, var(--surface) 100%);
      animation: pulse 0.6s ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .picker-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .picker-name {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      min-height: 1.2em;
      transition: color 0.2s;
    }

    .picker-zone.winner .picker-name {
      color: #b45309;
      font-size: 2.75rem;
    }

    .picker-zone.spinning .picker-name {
      animation: flicker 0.08s infinite alternate;
    }

    @keyframes flicker {
      from { opacity: 0.7; transform: translateY(-1px); }
      to { opacity: 1; transform: translateY(1px); }
    }

    .picker-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      font-family: inherit;
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgb(79 70 229 / 0.35);
    }

    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { background: var(--border); }

    .btn-accent { background: var(--accent); color: white; }
    .btn-accent:hover:not(:disabled) { background: #d97706; }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: white;
    }

    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-icon { padding: 6px 10px; min-width: 36px; }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-form input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .add-form input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .add-form input.error { border-color: var(--danger); }

    .form-hint {
      font-size: 0.8rem;
      color: var(--danger);
      margin-top: -10px;
      margin-bottom: 12px;
      min-height: 1.2em;
    }

    .student-list {
      list-style: none;
      max-height: 320px;
      overflow-y: auto;
    }

    .student-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: var(--surface);
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .student-item:last-child { margin-bottom: 0; }
    .student-item.picked { opacity: 0.45; background: var(--bg); }

    .student-item.highlight {
      border-color: var(--accent);
      background: var(--accent-light);
      transform: scale(1.01);
    }

    .student-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .student-name {
      flex: 1;
      font-weight: 600;
      font-size: 1rem;
    }

    .student-name input {
      width: 100%;
      padding: 4px 8px;
      border: 2px solid var(--primary);
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
    }

    .student-actions { display: flex; gap: 4px; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state .emoji {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .options-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: var(--radius-sm);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .stats {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-chip {
      padding: 6px 12px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .history-chip.latest {
      background: var(--accent-light);
      color: #b45309;
    }

    .history-empty {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .list-header .card-title { margin-bottom: 0; }

    .preset-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .preset-row select {
      flex: 1;
      min-width: 140px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--surface);
    }

    .preset-row select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .preset-save-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preset-save-row input {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
    }

    .preset-save-row input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .preset-active {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--primary-light);
      border-radius: var(--radius-sm);
    }

    .preset-active.muted {
      color: var(--text-muted);
      background: var(--bg);
      font-weight: 500;
    }

    .preset-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.4rem; }
      .picker-name { font-size: 2rem; }
      .picker-zone.winner .picker-name { font-size: 2.2rem; }
      .picker-actions { flex-direction: column; width: 100%; }
      .picker-actions .btn { width: 100%; }
      .add-form { flex-direction: column; }
      .stats { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-row">
      <header>
        <h1>🎲 <span data-i18n="tool.class-random-picker.title">Random Picker</span></h1>
        <p data-i18n="tool.class-random-picker.subtitle">Register student names and pick one fairly</p>
      </header>
      <button type="button" class="btn btn-secondary" id="btn-language" data-i18n-aria="tool.class-random-picker.aria.switchLanguage">한국어</button>
    </div>

    <section class="card">
      <div class="picker-zone" id="pickerZone">
        <div class="picker-label" data-i18n="tool.class-random-picker.labels.selectedStudent">Selected Student</div>
        <div class="picker-name" id="pickerName">—</div>
      </div>
      <div class="picker-actions">
        <button class="btn btn-primary" id="pickBtn" data-i18n="tool.class-random-picker.actions.pickRandom">🎯 Pick Random</button>
        <button class="btn btn-accent" id="pickAgainBtn" disabled data-i18n="tool.class-random-picker.actions.pickAgain">🔄 Pick Again</button>
        <button class="btn btn-secondary" id="resetPickedBtn" data-i18n="tool.class-random-picker.actions.resetPicked">↩️ Reset Picks</button>
      </div>
    </section>

    <section class="card">
      <div class="card-title" data-i18n="tool.class-random-picker.sections.preset">Preset</div>
      <div class="preset-active muted" id="activePresetLabel"></div>
      <div class="preset-row">
        <select id="presetSelect">
          <option value="" data-i18n="tool.class-random-picker.preset.selectPlaceholder">— Select preset —</option>
        </select>
        <button class="btn btn-primary btn-sm" id="loadPresetBtn" disabled data-i18n="tool.class-random-picker.actions.loadPreset">Load</button>
      </div>
      <div class="preset-save-row">
        <input type="text" id="presetNameInput" data-i18n-placeholder="tool.class-random-picker.placeholders.presetName" placeholder="Preset name (e.g. Grade 1 Class 3)" maxlength="30" autocomplete="off">
        <button class="btn btn-secondary btn-sm" id="savePresetBtn" data-i18n="tool.class-random-picker.actions.savePreset">Save New</button>
      </div>
      <div class="preset-actions">
        <button class="btn btn-secondary btn-sm" id="updatePresetBtn" disabled data-i18n="tool.class-random-picker.actions.updatePreset">Update Active Preset</button>
        <button class="btn btn-danger btn-sm" id="deletePresetBtn" disabled data-i18n="tool.class-random-picker.actions.deletePreset">Delete Preset</button>
      </div>
    </section>

    <section class="card">
      <div class="card-title" data-i18n="tool.class-random-picker.sections.settings">Picker Settings</div>
      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" id="excludePicked" checked>
          <span data-i18n="tool.class-random-picker.labels.excludePicked">Exclude already picked students</span>
        </label>
        <span class="stats" id="poolStats"></span>
      </div>
    </section>

    <section class="card">
      <div class="list-header">
        <div class="card-title" id="studentListTitle">Student List (0)</div>
        <button class="btn btn-danger btn-sm" id="clearAllBtn" data-i18n="tool.class-random-picker.actions.clearAll">Clear All</button>
      </div>
      <form class="add-form" id="addForm">
        <input type="text" id="nameInput" data-i18n-placeholder="tool.class-random-picker.placeholders.studentName" placeholder="Enter student name" maxlength="20" autocomplete="off">
        <button type="submit" class="btn btn-primary" data-i18n="tool.class-random-picker.actions.addStudent">Add</button>
      </form>
      <div class="form-hint" id="formHint"></div>
      <ul class="student-list" id="studentList"></ul>
    </section>

    <section class="card">
      <div class="card-title" data-i18n="tool.class-random-picker.sections.history">Pick History</div>
      <div class="history-list" id="historyList"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
