<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Fortress Battle - Ethan's Teacher Toolkit -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortress Battle</title>
  <link rel="stylesheet" href="../shared/toolkit-home.css">
  <script src="../shared/toolkit-home.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a2744;
      --panel: #243656;
      --text: #f5f7ff;
      --muted: #b8c4e0;
      --team-a: #4da3ff;
      --team-a-dark: #2b6cb0;
      --team-b: #ff7b54;
      --team-b-dark: #c05621;
      --accent: #ffd166;
      --danger: #ff4d6d;
      --success: #70e000;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    html, body {
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #2a3f6b 0%, var(--bg) 55%);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ── */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 3px solid rgba(255, 255, 255, 0.08);
    }

    .title-block h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: 0.04em;
    }

    .title-block p {
      color: var(--muted);
      font-size: clamp(0.85rem, 2vw, 1rem);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    /* ── Buttons ── */
    .btn {
      border: none;
      border-radius: 14px;
      padding: 0.75rem 1.2rem;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 4px 0 var(--shadow);
      color: #1a1a1a;
    }

    .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-new { background: var(--accent); }
    .btn-full { background: #90e0ef; color: #123; }

    .btn-attack {
      background: linear-gradient(180deg, #ffe066 0%, #f4a261 100%);
      min-width: 140px;
      min-height: 64px;
      font-size: clamp(1.1rem, 2.5vw, 1.45rem);
    }

    .btn-turn {
      flex: 1;
      min-width: 140px;
      min-height: 58px;
      font-size: clamp(1rem, 2.3vw, 1.3rem);
      color: var(--text);
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid transparent;
    }

    .btn-turn.active-a {
      background: rgba(77, 163, 255, 0.35);
      border-color: var(--team-a);
      box-shadow: 0 0 18px rgba(77, 163, 255, 0.5), 0 4px 0 var(--shadow);
    }

    .btn-turn.active-b {
      background: rgba(255, 123, 84, 0.35);
      border-color: var(--team-b);
      box-shadow: 0 0 18px rgba(255, 123, 84, 0.5), 0 4px 0 var(--shadow);
    }

    /* ── Settings panel ── */
    .settings-panel {
      margin: 0.75rem 1.25rem 0;
      padding: 0.9rem 1.1rem;
      background: var(--panel);
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.08);
    }

    .settings-panel summary {
      cursor: pointer;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      font-weight: 700;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .settings-panel summary::-webkit-details-marker { display: none; }

    .settings-body {
      display: grid;
      gap: 1rem;
      margin-top: 1rem;
    }

    .setting-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .setting-row label {
      font-weight: 700;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      min-width: 110px;
    }

    .hp-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .hp-options label,
    .damage-row label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.85rem;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      cursor: pointer;
    }

    .damage-input {
      flex: 1;
      min-width: 180px;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font-size: 1.05rem;
    }

    .btn-apply {
      background: #95d5b2;
      color: #123;
      padding: 0.55rem 1rem;
      font-size: 1rem;
    }

    .setting-hint {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* ── Main layout ── */
    .game-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0.75rem 1.25rem 1.25rem;
      gap: 0.75rem;
      min-height: 0;
    }

    .turn-row {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    .battlefield {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr minmax(220px, 320px) 1fr;
      gap: clamp(0.5rem, 2vw, 1.25rem);
      align-items: stretch;
      min-height: 320px;
    }

    /* ── Team panels ── */
    .team-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
      border-radius: 20px;
      border: 4px solid transparent;
      background: rgba(0, 0, 0, 0.22);
      position: relative;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .team-panel.team-a { border-color: rgba(77, 163, 255, 0.35); }
    .team-panel.team-b { border-color: rgba(255, 123, 84, 0.35); }

    .team-panel.active {
      box-shadow: 0 0 28px rgba(255, 255, 255, 0.12);
    }

    .team-panel.team-a.active {
      border-color: var(--team-a);
      box-shadow: 0 0 32px rgba(77, 163, 255, 0.45);
    }

    .team-panel.team-b.active {
      border-color: var(--team-b);
      box-shadow: 0 0 32px rgba(255, 123, 84, 0.45);
    }

    .team-name {
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .team-a .team-name { color: var(--team-a); }
    .team-b .team-name { color: var(--team-b); }

    .fortress {
      font-size: clamp(4rem, 12vw, 7rem);
      line-height: 1;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4));
      user-select: none;
    }

    .hp-block {
      width: 100%;
      max-width: 280px;
    }

    .hp-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.35rem;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      font-weight: 700;
    }

    .hp-bar {
      width: 100%;
      height: clamp(22px, 4vw, 32px);
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .hp-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    .team-a .hp-fill { background: linear-gradient(90deg, var(--team-a-dark), var(--team-a)); }
    .team-b .hp-fill { background: linear-gradient(90deg, var(--team-b-dark), var(--team-b)); }

    .damage-popup {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
      z-index: 5;
    }

    .damage-popup.show {
      animation: damagePop 1.1s ease forwards;
    }

    .damage-popup.miss { color: #cbd5e1; }
    .damage-popup.hit { color: var(--danger); }

    @keyframes damagePop {
      0% { opacity: 0; transform: translate(-50%, -20%) scale(0.4); }
      20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
      70% { opacity: 1; transform: translate(-50%, -90%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -120%) scale(0.9); }
    }

    /* ── Center controls ── */
    .center-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.75rem;
    }

    .attack-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
    }

    .turn-badge {
      text-align: center;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 700;
      color: var(--accent);
      min-height: 1.4em;
    }

    /* ── Arena overlay (projectiles / explosions) ── */
    .arena-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .projectile {
      position: absolute;
      width: 42px;
      height: 42px;
      margin-left: -21px;
      margin-top: -21px;
      font-size: 34px;
      line-height: 42px;
      text-align: center;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
      z-index: 51;
    }

    .projectile.ball {
      background: radial-gradient(circle at 30% 30%, #fff 0%, #888 45%, #333 100%);
      border-radius: 50%;
      font-size: 0;
    }

    .explosion {
      position: absolute;
      width: 90px;
      height: 90px;
      margin-left: -45px;
      margin-top: -45px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #ffd166 25%, #ff7b54 55%, transparent 72%);
      opacity: 0;
      z-index: 52;
    }

    .explosion.boom {
      animation: boom 0.55s ease-out forwards;
    }

    @keyframes boom {
      0% { opacity: 1; transform: scale(0.3); }
      40% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1.6); }
    }

    /* ── Winner overlay ── */
    .winner-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      z-index: 100;
      padding: 1.5rem;
    }

    .winner-overlay.show { display: flex; }

    .winner-card {
      text-align: center;
      background: linear-gradient(180deg, #2d4a7a 0%, #1a2744 100%);
      border: 4px solid var(--accent);
      border-radius: 24px;
      padding: clamp(1.5rem, 4vw, 3rem);
      max-width: 640px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: winnerIn 0.5s ease;
    }

    @keyframes winnerIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .winner-card h2 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin-bottom: 0.5rem;
    }

    .winner-card p {
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .winner-card .btn-new {
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      padding: 0.9rem 1.8rem;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .battlefield {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }

      .center-panel { order: 2; }
      .team-panel.team-a { order: 1; }
      .team-panel.team-b { order: 3; }

      .attack-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .btn-attack {
        min-width: 0;
        min-height: 56px;
        font-size: 0.95rem;
        padding: 0.5rem;
      }
    }

    @media (max-width: 520px) {
      .attack-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="title-block">
      <h1 data-i18n="tool.fortress-battle.title">Fortress Battle</h1>
      <p data-i18n="tool.fortress-battle.subtitle">Team A vs Team B — Classroom Battle Game</p>
    </div>
    <div class="top-actions">
      <button class="btn btn-full" id="btn-language" type="button" data-i18n-aria="tool.fortress-battle.aria.switchLanguage">한국어</button>
      <button class="btn btn-new" id="btnNewGame" type="button" data-i18n="tool.fortress-battle.actions.newGame">New Game</button>
      <button class="btn btn-full" id="btnFullscreen" type="button" data-i18n="tool.fortress-battle.actions.fullscreen">Fullscreen</button>
    </div>
  </header>

  <details class="settings-panel" id="settingsPanel">
    <summary data-i18n="tool.fortress-battle.settings.title">⚙ Game Settings</summary>
    <div class="settings-body">
      <div class="setting-row">
        <label data-i18n="tool.fortress-battle.settings.startHp">Start HP</label>
        <div class="hp-options" id="hpOptions">
          <label><input type="radio" name="startHp" value="30" /> 30</label>
          <label><input type="radio" name="startHp" value="50" checked /> 50</label>
          <label><input type="radio" name="startHp" value="100" /> 100</label>
        </div>
      </div>
      <div class="setting-row damage-row">
        <label for="damageInput" data-i18n="tool.fortress-battle.settings.damageValues">Damage values</label>
        <input class="damage-input" id="damageInput" type="text" value="0,10,20,30" />
        <button class="btn btn-apply" id="btnApplyDamage" type="button" data-i18n="tool.fortress-battle.actions.apply">Apply</button>
      </div>
      <p class="setting-hint" data-i18n="tool.fortress-battle.settings.hint">Comma-separated numbers. Example: 0,10,20,30</p>
    </div>
  </details>

  <main class="game-wrap">
    <div class="turn-row">
      <button class="btn btn-turn" id="btnTurnA" type="button" data-i18n="tool.fortress-battle.turn.teamAButton">Team A Turn</button>
      <button class="btn btn-turn" id="btnTurnB" type="button" data-i18n="tool.fortress-battle.turn.teamBButton">Team B Turn</button>
    </div>

    <section class="battlefield" id="battlefield">
      <!-- Team A -->
      <article class="team-panel team-a" id="teamPanelA" data-team="A">
        <h2 class="team-name">Team A</h2>
        <div class="fortress" aria-hidden="true">🏰</div>
        <div class="hp-block">
          <div class="hp-label-row">
            <span>HP</span>
            <span id="hpTextA">50 / 50</span>
          </div>
          <div class="hp-bar"><div class="hp-fill" id="hpFillA"></div></div>
        </div>
        <div class="damage-popup" id="damagePopupA"></div>
      </article>

      <!-- Center attacks -->
      <div class="center-panel">
        <p class="turn-badge" id="turnBadge">Team A's Turn</p>
        <div class="attack-grid">
          <button class="btn btn-attack" data-attack="0" type="button" data-i18n="tool.fortress-battle.attack.1">Attack 1</button>
          <button class="btn btn-attack" data-attack="1" type="button" data-i18n="tool.fortress-battle.attack.2">Attack 2</button>
          <button class="btn btn-attack" data-attack="2" type="button" data-i18n="tool.fortress-battle.attack.3">Attack 3</button>
          <button class="btn btn-attack" data-attack="3" type="button" data-i18n="tool.fortress-battle.attack.4">Attack 4</button>
        </div>
      </div>

      <!-- Team B -->
      <article class="team-panel team-b" id="teamPanelB" data-team="B">
        <h2 class="team-name">Team B</h2>
        <div class="fortress" aria-hidden="true">🏯</div>
        <div class="hp-block">
          <div class="hp-label-row">
            <span>HP</span>
            <span id="hpTextB">50 / 50</span>
          </div>
          <div class="hp-bar"><div class="hp-fill" id="hpFillB"></div></div>
        </div>
        <div class="damage-popup" id="damagePopupB"></div>
      </article>
    </section>
  </main>

  <div class="arena-layer" id="arenaLayer" aria-hidden="true"></div>

  <div class="winner-overlay" id="winnerOverlay" role="dialog" aria-modal="true" aria-labelledby="winnerTitle">
    <div class="winner-card">
      <h2 id="winnerTitle">Team A Wins!</h2>
      <p id="winnerSubtitle">The fortress has fallen!</p>
      <button class="btn btn-new" id="btnPlayAgain" type="button" data-i18n="tool.fortress-battle.actions.newGame">New Game</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
