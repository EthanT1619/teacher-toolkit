<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👥 Team Maker</title>
  <link rel="stylesheet" href="../shared/toolkit-home.css">
  <script src="../shared/toolkit-home.js" defer></script>
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #f59e0b;
      --accent-light: #fef3c7;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.06);
      --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.06);
      --radius: 12px;
      --radius-sm: 8px;
      --team-colors: #4f46e5, #0891b2, #059669, #d97706, #db2777, #7c3aed, #dc2626, #0d9488, #ca8a04, #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f0f4f8 50%, #fef3c7 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    header {
      text-align: center;
      flex: 1;
      min-width: 200px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      font-family: inherit;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgb(79 70 229 / 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--border);
    }

    .btn-accent {
      background: var(--accent);
      color: white;
    }

    .btn-accent:hover:not(:disabled) {
      background: #d97706;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: white;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .btn-icon {
      padding: 6px 10px;
      min-width: 36px;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-form input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    .add-form input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .add-form input.error {
      border-color: var(--danger);
    }

    .form-hint {
      font-size: 0.8rem;
      color: var(--danger);
      margin-top: -10px;
      margin-bottom: 12px;
      min-height: 1.2em;
    }

    .student-list {
      list-style: none;
      max-height: 320px;
      overflow-y: auto;
    }

    .student-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: var(--surface);
      transition: background 0.15s, border-color 0.15s;
    }

    .student-item:last-child {
      margin-bottom: 0;
    }

    .student-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .student-name {
      flex: 1;
      font-weight: 600;
      font-size: 1rem;
    }

    .student-name input {
      width: 100%;
      padding: 4px 8px;
      border: 2px solid var(--primary);
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
    }

    .student-actions {
      display: flex;
      gap: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state .emoji {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .list-header .card-title {
      margin-bottom: 0;
    }

    .preset-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .preset-row select {
      flex: 1;
      min-width: 140px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--surface);
    }

    .preset-row select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .preset-save-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preset-save-row input {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
    }

    .preset-save-row input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .preset-active {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--primary-light);
      border-radius: var(--radius-sm);
    }

    .preset-active.muted {
      color: var(--text-muted);
      background: var(--bg);
      font-weight: 500;
    }

    .preset-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    /* Team settings */
    .mode-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .mode-option {
      flex: 1;
      min-width: 140px;
    }

    .mode-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-option label {
      display: block;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      user-select: none;
    }

    .mode-option input:checked + label {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .setting-field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .setting-field input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1.1rem;
      font-weight: 700;
      font-family: inherit;
      text-align: center;
      transition: border-color 0.15s;
    }

    .setting-field input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .preview-box {
      padding: 12px 14px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .preview-box strong {
      color: var(--primary);
      font-weight: 700;
    }

    .preview-box.warn {
      background: var(--accent-light);
      color: #92400e;
    }

    .team-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Results */
    .results-zone {
      min-height: 120px;
    }

    .results-zone.empty {
      text-align: center;
      padding: 32px 16px;
      background: linear-gradient(180deg, var(--primary-light) 0%, var(--surface) 100%);
      border-radius: var(--radius);
      border: 2px dashed var(--border);
      color: var(--text-muted);
    }

    .results-zone.empty .emoji {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .results-zone.forming {
      text-align: center;
      padding: 32px 16px;
      background: linear-gradient(180deg, #ddd6fe 0%, var(--primary-light) 100%);
      border-radius: var(--radius);
      border: 2px solid var(--primary);
    }

    .results-zone.forming .forming-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      animation: flicker 0.08s infinite alternate;
    }

    @keyframes flicker {
      from { opacity: 0.7; transform: translateY(-1px); }
      to { opacity: 1; transform: translateY(1px); }
    }

    .results-zone.done {
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .team-card {
      border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .team-card-header {
      padding: 10px 14px;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .team-card-count {
      font-size: 0.8rem;
      opacity: 0.9;
      font-weight: 600;
    }

    .team-members {
      list-style: none;
      padding: 8px;
    }

    .team-member {
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
      background: var(--bg);
    }

    .team-member:last-child {
      margin-bottom: 0;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.4rem; }
      .add-form { flex-direction: column; }
      .settings-grid { grid-template-columns: 1fr; }
      .team-actions { flex-direction: column; width: 100%; }
      .team-actions .btn { width: 100%; }
      .teams-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-row">
      <header>
        <h1>👥 <span data-i18n="tool.team-maker.title">Team Maker</span></h1>
      </header>
      <button type="button" class="btn btn-secondary" id="btn-language" data-i18n-aria="tool.team-maker.aria.switchLanguage">한국어</button>
    </div>

    <section class="card">
      <div class="card-title" data-i18n="tool.team-maker.sections.result">Result</div>
      <div class="results-zone empty" id="resultsZone">
        <div class="emoji">🎯</div>
        <p>Add students and configure teams, then tap Assign Teams</p>
      </div>
      <div class="team-actions" style="margin-top: 16px;">
        <button class="btn btn-primary" id="assignBtn" data-i18n="tool.team-maker.actions.assignTeams">🎲 Assign Teams</button>
        <button class="btn btn-accent" id="reassignBtn" disabled data-i18n="tool.team-maker.actions.reassign">🔄 Reassign</button>
        <button class="btn btn-secondary" id="clearTeamsBtn" disabled data-i18n="tool.team-maker.actions.clearResult">↩️ Clear</button>
      </div>
    </section>

    <section class="card">
      <div class="card-title" data-i18n="tool.team-maker.sections.teamSettings">Team Settings</div>
      <div class="mode-row">
        <div class="mode-option">
          <input type="radio" name="assignMode" id="modeByCount" value="count" checked>
          <label for="modeByCount" data-i18n="tool.team-maker.labels.modeByCount">By team count</label>
        </div>
        <div class="mode-option">
          <input type="radio" name="assignMode" id="modeBySize" value="size">
          <label for="modeBySize" data-i18n="tool.team-maker.labels.modeBySize">By members per team</label>
        </div>
      </div>
      <div class="settings-grid">
        <div class="setting-field">
          <label for="teamCountInput" data-i18n="tool.team-maker.labels.teamCount">Number of teams</label>
          <input type="number" id="teamCountInput" min="2" max="20" value="4">
        </div>
        <div class="setting-field">
          <label for="teamSizeInput" data-i18n="tool.team-maker.labels.teamSize">Members per team</label>
          <input type="number" id="teamSizeInput" min="2" max="15" value="5">
        </div>
      </div>
      <div class="preview-box" id="previewBox">Add students to see a preview</div>
    </section>

    <section class="card">
      <div class="list-header">
        <div class="card-title" id="studentListTitle">Student List (0)</div>
        <button class="btn btn-danger btn-sm" id="clearAllBtn" data-i18n="tool.team-maker.actions.clearAll">Clear All</button>
      </div>
      <form class="add-form" id="addForm">
        <input type="text" id="nameInput" data-i18n-placeholder="tool.team-maker.placeholders.studentName" placeholder="Enter student name" maxlength="20" autocomplete="off">
        <button type="submit" class="btn btn-primary" data-i18n="tool.team-maker.actions.addStudent">Add</button>
      </form>
      <div class="form-hint" id="formHint"></div>
      <ul class="student-list" id="studentList"></ul>
    </section>

    <section class="card">
      <div class="card-title" data-i18n="tool.team-maker.sections.preset">Preset</div>
      <div class="preset-active muted" id="activePresetLabel"></div>
      <div class="preset-row">
        <select id="presetSelect">
          <option value="" data-i18n="tool.team-maker.preset.selectPlaceholder">— Select preset —</option>
        </select>
        <button class="btn btn-primary btn-sm" id="loadPresetBtn" disabled data-i18n="tool.team-maker.actions.loadPreset">Load</button>
      </div>
      <div class="preset-save-row">
        <input type="text" id="presetNameInput" data-i18n-placeholder="tool.team-maker.placeholders.presetName" placeholder="Preset name (e.g. Grade 1 Class 3)" maxlength="30" autocomplete="off">
        <button class="btn btn-secondary btn-sm" id="savePresetBtn" data-i18n="tool.team-maker.actions.savePreset">Save New</button>
      </div>
      <div class="preset-actions">
        <button class="btn btn-secondary btn-sm" id="updatePresetBtn" disabled data-i18n="tool.team-maker.actions.updatePreset">Update Active Preset</button>
        <button class="btn btn-danger btn-sm" id="deletePresetBtn" disabled data-i18n="tool.team-maker.actions.deletePreset">Delete Preset</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
